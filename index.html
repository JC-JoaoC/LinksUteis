<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links úteis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#007BFF" />
  <link rel="icon" href="src/assets/icon-192.png" />
  <link rel="apple-touch-icon" href="src/assets/icon-192.png" />
</head>

<body>
  <div class="container">
    <h1>Links úteis</h1>
    <p class="bio" style="font-weight: bold">
      <span id="relogio"></span> - 🌎 Guarulhos - SP
    </p>
    <div class="links-wrapper">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSem8DhUaHXUUD0LyLG7CAuyytwwUNMen26LJLKbuqMl7RjW8g/viewform"
        class="link-btn">
        🍾 551 - SACOLAS LÍQUIDOS
      </a>

      <a href="https://ams.gru.com.br/" class="link-btn"> 📡 AMS GRU </a>

      <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=2GlC2F7B8U253w5gMcP3TACIop1cAklOjQ-DMX8MktJUQjdQNjhBRUJYM1VGSDMySTMwUEkzSFhTWi4u"
        class="link-btn" id="btn-detalhes">
        📋 Formulário - Objetos esquecidos
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfZtVxa-gqKhZWyrn62pPQnk4u_KI58N6Q1qwoAAP_ooaywxg/viewform"
        class="link-btn">
        📦 Formulário - Itens Retidos
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSde7PgekIkAVdcFmkNGgow6A9MlNsY3Asa-gN_8t8I3g_ye8A/viewform"
        class="link-btn">
        🚑 Registro de Atendimento Médico
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfNp4BZQMtDAU3c71eD9zYkr7LYADWjVGc2DjzA9yAlj0AVXQ/viewform"
        class="link-btn">
        🚨 Relatório Diário de Ocorrência
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSczygYRd3S9kuNMl3XdeUfPk2FrA55HLGePt4MPK4Wyt7my2A/viewform"
        class="link-btn">
        🚧 SLA - Máquinas abertas
      </a>

      <a href="https://mobile.winglet.app/" target="_blank" class="link-btn">
        ✈️ Winglet - Aferições
      </a>

      <button class="link-btn featured" id="btn-medicao" style="cursor: pointer; width: 100%;">
        ⏱️ Medição
      </button>
    </div>

    <div class="modal-overlay" id="modalMedicao">
      <div class="modal-content">
        <span class="close-btn" id="closeMedicao">&times;</span>
        <h2 style="margin-bottom: 15px; color: #007BFF;">Controle de Medição</h2>

        <div class="medicao-controls" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
          <label for="select-terminal" style="font-weight: bold;">Terminal:</label>
          <select id="select-terminal" class="custom-select"
            style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
            <option value="T2">Terminal 2</option>
            <option value="T3">Terminal 3</option>
          </select>

          <label for="select-local" style="font-weight: bold;">Local:</label>
          <select id="select-local" class="custom-select"
            style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
            <!-- Opções preenchidas dinamicamente -->
          </select>
        </div>

        <div class="medicao-status-container"
          style="text-align: center; margin-top: 20px; padding: 20px; border-radius: 10px; background-color: #f5f5f5;">
          <p id="medicao-time" style="font-size: 32px; font-weight: bold; margin-bottom: 5px;">--:--</p>
          <p id="medicao-message" style="font-size: 18px; font-weight: 500;">Carregando...</p>
        </div>
      </div>
    </div>

  </div>

  <script src="src/js/script.js"></script>
</body>

</html>
